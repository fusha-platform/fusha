
name: fusha_workspace
description: Fusha Palestinian Experiences Monorepo
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - apps/customer_mobile
  - apps/management_dashboard
  - packages/design_system
  - packages/app_core
  - packages/shared_models
  - packages/shared_services
  - packages/shared_widgets
  - packages/firebase_backend

dev_dependencies:
  melos: ^8.2.2


melos:
  scripts:
    analyze_dart:
      description: Analyze pure Dart packages.
      run: dart run melos exec --fail-fast --scope=app_core -- dart analyze

    analyze_flutter:
      description: Analyze Flutter packages and applications.
      run: dart run melos exec --fail-fast --ignore=app_core -- flutter analyze

    test_dart:
      description: Run tests for pure Dart packages.
      run: dart run melos exec --fail-fast --scope=app_core -- dart test

    test_flutter:
      description: Run tests for Flutter packages and applications.
      run: dart run melos exec --fail-fast --dir-exists=test --ignore=app_core -- flutter test

    format:
      description: Format the entire workspace.
      run: dart format .