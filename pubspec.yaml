
name: fusha_workspace
description: Fusha Palestinian Experiences Monorepo
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - apps/customer_mobile
  - apps/management_dashboard
  - packages/design_system
  - packages/app_core
  - packages/shared_models
  - packages/shared_services
  - packages/shared_widgets
  - packages/firebase_backend

dev_dependencies:
  melos: ^8.2.2


melos:
  scripts:
    analyze_dart:
      description: Analyze all pure Dart packages.
      run: dart run melos exec --fail-fast --no-flutter -- dart analyze

    analyze_flutter:
      description: Analyze all Flutter packages and applications.
      run: dart run melos exec --fail-fast --flutter -- flutter analyze

    test_dart:
      description: Run tests for all pure Dart packages.
      run: dart run melos exec --fail-fast --no-flutter --dir-exists=test -- dart test

    test_flutter:
      description: Run tests for all Flutter packages and applications.
      run: dart run melos exec --fail-fast --flutter --dir-exists=test -- flutter test

    format:
      description: Format the entire workspace.
      run: dart format .