name: customer_mobile
description: Fusha customer mobile application.
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Workspace packages
  design_system: any
  app_core: any

  # Flutter UI
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Navigation
  go_router: ^18.1.4

  # Dependency injection
  get_it: ^9.3.0

  # Localization
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
