name: Fusha CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: Set up Melos
        run: dart pub global activate melos 8.2.2

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Analyze pure Dart packages
        run: dart run melos exec --fail-fast --scope=app_core -- dart analyze

      - name: Analyze Flutter packages
        run: dart run melos exec --fail-fast --ignore=app_core -- flutter analyze

      - name: Test pure Dart packages
        run: dart run melos exec --fail-fast --scope=app_core -- dart test

      - name: Test Flutter packages
        run: dart run melos exec --fail-fast --dir-exists=test --ignore=app_core -- flutter test