name: Fusha CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - name: Set up Melos
        run: dart pub global activate melos 8.10.1

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Analyze pure Dart packages
        run: dart run melos run analyze_dart

      - name: Analyze Flutter packages
        run: dart run melos run analyze_flutter

      - name: Test pure Dart packages
        run: dart run melos run test_dart

      - name: Test Flutter packages
        run: dart run melos run test_flutter
